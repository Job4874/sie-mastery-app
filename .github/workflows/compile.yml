name: compile-check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Compile Python
        run: python -m py_compile server.py security.py tts_engine.py tools/content_lib.py tools/validate_content.py tools/verify.py tools/compose_audio.py tools/verify_bits.py tools/verify_dom.py tools/verify_exhaustive.py tools/verify_hell.py tests/test_security.py tests/grammar_audit.py
      - name: Validate lesson content JSON
        run: python tools/validate_content.py
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Syntax-check all split JavaScript files
        run: |
          for f in static/js/app.js static/js/core/*.js static/js/data/*.js static/js/data/units/*.js static/js/ui/*.js tests/*.js; do
            node --check "$f"
          done
      - name: Verify build integrity
        run: python tools/verify.py
      - name: Server and security tests
        run: python -m unittest tests.test_security -v
      - name: Question bank, curriculum, router, grader and exam tests
        run: node tests/app.test.js
      - name: Dual-theme WCAG contrast and DOM audit
        run: node tests/tests9.js
      - name: ML teacher verification
        run: node tests/ml_verify.js
      - name: Calm study UI audit
        run: node tests/ui_enterprise.js
      - name: Grammar and documentation audit
        run: python tests/grammar_audit.py
